<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人語島 島嶼人｜博物館導覽</title>
<style>
:root{--bg:#fbeee0;--ink:#3b2a1d;--card:#fff8f0;--cab:#17607f;--cabh:#0f4a63;--wood:#a8743f;--sky:#bfe3f2;--red:#d62828;--line:#e3c9ad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a16;--ink:#f1e4d6;--card:#2b231d;--cab:#2c86ab;--cabh:#3a9cc3;--line:#4a3b2f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
header{padding:20px 16px 8px;text-align:center}
h1{font-size:1.5rem;margin:0}
header p{margin:6px 0 0;font-size:.9rem;opacity:.8}
.plan{display:grid;gap:22px 16px;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.8fr);grid-template-rows:44px 44px repeat(3,minmax(96px,17vw));grid-template-areas:"cui cui cui cui ." "pa pa pa pa ." "c0 c1 c2 c3 pr" "c4 c5 c6 c7 pr" "c8 c9 c10 c11 fl";max-width:640px;margin:12px auto;padding:0 12px}
.cab{background:var(--cab);color:#fff;border:0;font:inherit;font-size:.85rem;display:flex;align-items:center;justify-content:center;text-align:center;min-height:62px;cursor:pointer;position:relative;padding:4px}
.cab:hover,.cab:focus-visible{background:var(--cabh);outline:none}
.hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.trap{clip-path:polygon(0 0,100% 12%,100% 88%,0 100%)}
.wide{min-height:40px}
.qc{border-radius:100% 0 0 0}
.dot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff;top:50%;left:50%;translate:-50% -50%}
.hint{text-align:center;font-size:.8rem;opacity:.7;margin:0 0 24px}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#m.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;border:3px solid var(--wood);padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top h2{margin:0;font-size:1.3rem}
.top button{border:0;background:none;font-size:1.6rem;color:var(--ink);cursor:pointer}
.mini{display:grid;gap:5px;width:120px;flex:none;grid-template-columns:repeat(4,1fr) .8fr;grid-template-areas:"cui cui cui cui ." "pa pa pa pa ." "c0 c1 c2 c3 pr" "c4 c5 c6 c7 pr" "c8 c9 c10 c11 fl";border:3px solid var(--wood);background:var(--sky);padding:3px;border-radius:6px}
.mini div{background:var(--cab);min-height:9px;position:relative;opacity:.55}
.mini .dot{width:9px;height:9px}
.ph{background:var(--line);border-radius:10px;height:130px;display:flex;align-items:center;justify-content:center;opacity:.8;margin:12px 0;font-size:.9rem}
.it{border-top:1px solid var(--line);padding:10px 0}
.it b{display:block;color:var(--wood)}
.empty{opacity:.7;padding:16px 0}
.gb{display:block;margin:0 auto 28px;border:3px solid var(--wood);background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:10px 20px;border-radius:999px;cursor:pointer}
.op{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;border-radius:10px;cursor:pointer}
.op.no{border-color:var(--red);opacity:.5}
.op.ok{border-color:#2a9d4a}
.code{font-size:1.8rem;font-weight:800;text-align:center;color:var(--wood);margin:18px 0;letter-spacing:.05em}
</style></head><body>

<div class="ban"><b>🎁 玩小遊戲，領取暗號！</b>答對三題就能拿到暗號，再拿給工作人員看。<br><button onclick="document.getElementById('gb').click()">開始遊戲</button></div>
<section class="intro"><h2>關於博物館</h2><p>人語島，人類共同的語言也許是島嶼中的瑰寶。島嶼人，而這片大地記錄著人類的故事。</p><p>博物館組不只是敘述礦物的特色，更是締結人與地球家園的生命感。深入地礦相關知識，了解到台灣寶島的迴響。</p><p>回想著大地瑰寶的展品，從礦物的演化到晶體對稱、色澤。從島嶼的礦產到大自然的縮影。</p><p>重新審視人類的生活，並看見礦物在人類生活中無所不在。關於宏觀宇宙，關於微觀晶體，我們都震懾於此等生命感。而這生命感正是我們誠摯邀請您蒞臨博物館的根柢。</p></section>

"璀璨區":[["鐘乳石與石筍","地下水溶解石灰岩，含Ca(HCO₃)₂的礦液流入洞穴；洞穴氣壓較小，逆反應使CaCO₃再度沉澱。從頂部往下滴形成鐘乳石，從底部往上長形成石筍。"],["台灣少見的大塊石英","板塊運動形成張裂裂隙，富含SiO₂的熱液流進夠大的空間；隨高度上升、溫壓驟降，溶解度崩潰而沉澱出大塊石英。"],["紫水晶","形成初期Fe³⁺取代Si⁴⁺造成結構缺陷；輻射使電子位移形成電子陷阱（色心），吸收黃綠光而呈紫色。"],["北投石","1905年岡本要八郎在北投溪發現含鐳的結晶，以底片感光實驗證實具天然放射性，1912年發表，是唯一以台灣地名命名的礦物。"]],
"古生物區":[["棘皮動物（海膽）","最大特徵是五輻對稱。頂部小孔是肛門，口器在底部；棘與殼體以軟組織相連，死後易被沖走，只能從小孔看出原本有棘。"],["節肢動物（三葉蟲）","身體分成軸葉與左右兩片肋葉，是第一個發展出眼睛的物種，也是古生代的指標化石。指標化石：演化快、分布廣、數量多、特徵明顯。"],["熱河生物群","中國遼寧、河北一帶的早白堊紀陸相化石；火山灰快速掩埋並提供無氧環境，軟組織得以保存。重要發現有小盜龍（帶羽恐龍）、孔子鳥、古果；另有三尾擬蜉蝣、狼鰭魚。"],["潘常武翁戎螺","已滅絕的翁戎螺，出土於南投中寮大坑中新世南港層，以化石採集家潘常武命名。翁戎螺最早出現於寒武紀，是活化石。"],["珊瑚","化石上的小孔是珊瑚蟲生活處。顏色來自共生的蟲黃藻；壓力下蟲黃藻被排出，露出白色碳酸鈣骨骼，就是白化。"],["左鎮動物群","發掘於台南菜寮溪、鹽水溪與三重溪流域，濱海沉積的地層隆起後被河流切割，大雨後化石出露。展出的老虎頭骨是在不同地方撿到，卻能拼接在一起。"],["澎湖水道化石群","末次冰期海平面下降約120公尺，水深僅60公尺的台灣海峽幾乎全露出，成為大型哺乳類南遷的陸橋；冰期結束後，漁民以底撈網將化石碎塊帶回。"],["矽化木","遠古樹木被富含礦物質的火山灰或泥沙迅速掩埋，含SiO₂的地下水緩慢滲入，取代原本的木質細胞。"]],
"碳酸鹽":[["石灰岩與方解石","石灰岩主成分為方解石，用於水泥，依成因分生物性、化學性、碎屑性。方解石多為菱面體，有明顯雙折射；縞狀方解石的顏色來自不同雜質。"],["霰石","成分與方解石相同（同質異形體），低溫高壓形成，在自然環境中不穩定，會慢慢轉回方解石。"],["藍銅礦與孔雀石","常共生，藍銅礦氧化後變成孔雀石。古代畫家以藍銅礦作藍色顏料、孔雀石作綠色顏料（《千里江山圖》）。"]],
"二氧化矽":[["顯晶質：水晶","通常為六角柱狀，側面有生長紋。紫水晶含三價鐵離子，粉晶含錳離子，茶晶含三價鋁離子。"],["隱晶質：瑪瑙與玉髓","含SiO₂的溶液流入岩石孔洞，由外而內結晶。瑪瑙含雜質所以有紋路；玉髓過程相同但無雜質，結構緻密，光線不斷折射而像包裹著光。"],["非晶質：蛋白石與黑曜石","蛋白石由二氧化矽膠體排列而成，孔隙含水使光繞射，產生遊彩。黑曜石是岩漿噴發後快速接觸海水或空氣冷卻，來不及結晶。"]],
"矽酸鹽":[["石榴子石","通常為12、24、36面體，硬度高，可作磨料。台灣的多生長在變質岩帶，可由晶帶推測變質過程。"],["沸石","結構含許多水分子，加熱時冒泡像沸騰；多孔洞，可作吸附材料，有些貓砂也會添加。"],["雲母與金雲母","雲母節理發達、呈片狀，可作絕緣隔熱材料，如吹風機的電熱板。金雲母在高溫高壓下變質形成，例如金伯利岩，岩漿的揮發性物質會連同鑽石從地幔急速帶近地面。"],["電氣石","具壓電性，加壓變形時會產生電流；漂亮的稱為碧璽，微量元素使顏色不同。"],["藍晶石與矽線石","與紅柱石成分相同，但在不同溫度、壓力下形成，可作環境指標。"]],
"長石":[["鈉長石、鉀長石、鈣長石","鈉、鉀長石可單獨存在；鈣長石與鈉長石形成固溶體，以任意比例組成的稱斜長石。斜長石可用於陶瓷、彩釉與耐火材料。"],["拉長石","斜長石的一種，聚片雙晶使光散色與干涉而產生變彩，出現在對稱的兩個面上。"]],
"硫化物":[["硫磺","元素硫，易氧化成易燃的二氧化硫，以前被加在火藥中。硫磺溫泉的臭味其實是硫化氫。"],["雄黃與雌黃","雄黃鮮豔橘紅，雌黃橘黃。雄黃可作端午節的雄黃酒；古紙偏黃，古人寫錯字用雌黃塗掉，即「信口雌黃」。兩者燒製後變成氧化砷，也就是砒霜。"],["基隆砂金與硫砷銅礦","基隆金有稜角，推測離金礦源頭不遠，因而找到九份；九份煉金時發現硫砷銅礦，隔壁山整座都是，可用來煉銅。"]],
"硫酸鹽":[["纖維石膏","平行纖維狀結構，切塊打磨後有電視石效果：光線在纖維內反射不逸出，覆蓋的字看起來浮到表面。"],["硬石膏","無水石膏，遇水吸水轉變為更常見的石膏，這種轉變可逆。"],["透石膏","纖維石膏在高溫高壓下長時間結晶後，變成板狀構造。"]],
"火成岩":[["火成岩","由熔岩或岩漿冷卻凝固而成。依SiO₂含量分酸性、中性、基性、超基性；地表冷卻的是噴出岩，地下緩慢冷卻的是深成岩，礦物顆粒較容易看到。"],["花崗岩（酸性）","偉晶花崗岩晶體大於一公分，是常見建材，灰色是長石、黑色是雲母；電氣石偉晶花崗岩的柱狀體是電氣石。"],["安山岩（中性）","具斑狀結晶，白色部分是長石。青磐岩化安山岩受火山熱液影響產生綠泥石、綠簾石等綠色礦物，是附近有金、銀礦的指標之一。"],["玄武岩（基性）","外觀看不到結晶，快速冷卻形成氣孔，氣孔可被文石、沸石填充。"]],
"超基性岩":[["台灣玉與石綿","石綿過去作建材、隔音材料，日本人曾大量取材，後來發現纖維會對肺造成永久傷害。台灣玉與石綿共生，曾被當作沒價值而丟棄，後來發現打磨後有貓眼效果。"],["橄欖岩與擄獲岩","橄欖岩是地函的主要組成。擄獲岩外面黑色的是玄武岩，包裹橄欖岩：玄武岩質岩漿上升經過地函時將其包覆帶到地表。"],["薔薇輝石","含錳而呈特別的粉色，有觀賞價值，可製作印章。"]],
"高變質岩":[["片麻岩","火成岩變質成正片麻岩，沉積岩變質成副片麻岩。分布於中央山脈北部、花蓮與東澳之間，記錄台灣變質帶核心區的構造運動歷史。"]],
"沈積變質":[["沉積岩","岩石風化後經搬運、堆積、壓密、膠結形成。頁岩有頁理，垂直於應力方向。"],["礫岩：石門古戰場","牡丹社事件發生地。礫岩比周圍泥岩堅硬，形成絕壁陡峭、易守難攻的地勢，原住民為保衛家園在此作戰。"],["千枚岩","中度變質的岩石，表面亮亮的是雲母，表示已有一定的變質程度。"]],
"構造":[["斷面擦痕","斷層兩盤錯動摩擦，岩石碎塊在斷層面上留下痕跡，可指示錯動方向。"],["濁流岩","濁流（富含懸浮顆粒、密度大於海水的水流）順斜坡流動沉積而成，常由地震、風暴、海底山崩觸發。"],["斷層角礫岩","斷層帶中構造運動使岩層脆性變形，兩側磨削產生鬆散碎片。"],["波痕與生痕化石","波痕是水或風在沉積物表面形成的波狀起伏；生痕化石是保存在地層中的遠古生物活動遺跡。"],["熱水礦物沉澱與褶皺","熱液因化學成分不同沉澱出不同顏色的礦物；水平沉積的地層受擠壓而彎曲稱褶皺作用。"]],
"氧化鐵":[],"螢光礦物區":[]};
